<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#0A0A0A" stroke="#262626" stroke-width="4"/>
  <!-- Robot Car base -->
  <rect x="25" y="60" width="50" height="16" rx="4" fill="#171717" stroke="#3B82F6" stroke-width="3"/>
  <!-- Wheels -->
  <circle cx="33" cy="78" r="6" fill="#000000" stroke="#3B82F6" stroke-width="3"/>
  <circle cx="67" cy="78" r="6" fill="#000000" stroke="#3B82F6" stroke-width="3"/>
  <!-- Robotic Arm Segments -->
  <line x1="50" y1="60" x2="50" y2="40" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="40" r="4" fill="#FFFFFF"/>
  <line x1="50" y1="40" x2="65" y2="25" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="65" cy="25" r="3.5" fill="#FFFFFF"/>
  <!-- Gripper -->
  <path d="M60 18 L65 24 L70 18" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>